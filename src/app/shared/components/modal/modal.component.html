<div class="modal-overlay" *ngIf="visible">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">{{ title }}</span>
      <button class="close-btn" (click)="onClose()">&times;</button>
    </div>
    <div class="modal-body">
      <ng-content></ng-content>
    </div>
  </div>
</div>
